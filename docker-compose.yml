services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # --> Bound to localhost only: reachable from this machine, not from the network
    # REDIS_HOST_PORT changes the host port if 6379 is taken (keep REDIS_URL in sync)
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    # --> AOF persistence: data survives container restarts
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
